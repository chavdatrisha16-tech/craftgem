<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Hidden Gems</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-container {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-box {
            width: 500px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .auth-box h1 {
            text-align: center;
            color: #3d261b;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #4b2e20;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #c56b32;
        }

        .register-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #c56b32;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-submit:hover {
            background: #9f4f22;
        }

        .register-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }

        .auth-link a {
            color: #c56b32;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home {
            text-align: center;
            margin-top: 15px;
        }

        .back-home a {
            color: #666;
            text-decoration: none;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <nav class="navbar">

        <div class="logo">
            Hidden<span>Gems</span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="artisans.html">Explore Artisans</a></li>
            <li><a href="index.html#categories">Categories</a></li>
            <li><a href="index.html#about">About Us</a></li>
        </ul>

    </nav>
</header>


<div class="auth-container">

    <div class="auth-box">

        <h1>Create Account</h1>

        <p class="subtitle">
            Join the Hidden Gems community
        </p>


        <form id="registerForm">

            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>


            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>


            <div class="form-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    maxlength="10"
                    required
                >
            </div>


            <div class="form-group">
                <label for="location">Location</label>

                <input
                    type="text"
                    id="location"
                    placeholder="Enter your city/location"
                    required
                >
            </div>


            <div class="form-group">
                <label for="role">Register As</label>

                <select id="role" required>

                    <option value="">
                        Select account type
                    </option>

                    <option value="user">
                        User
                    </option>

                    <option value="artisan">
                        Artisan
                    </option>

                </select>
            </div>


            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >
            </div>


            <div class="form-group">
                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >
            </div>


            <button
                type="submit"
                class="register-submit"
                id="registerButton">

                Create Account

            </button>

            <p id="message" class="message"></p>

        </form>


        <p class="auth-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <div class="back-home">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>

    </div>

</div>


<!-- Supabase + Registration -->
<script type="module">

    import { createClient }
        from "https://esm.sh/@supabase/supabase-js@2";


    const SUPABASE_URL =
        "https://tsgrrnivmaujjteavgkf.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_1b5y0mhKKjobcvFzXHIHOQ_vco2_Ldl";


    const supabaseClient =
        createClient(SUPABASE_URL, SUPABASE_KEY);


    console.log("Supabase connected successfully");


    const form =
        document.getElementById("registerForm");

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("registerButton");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();


        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const location =
            document.getElementById("location").value.trim();

        const role =
            document.getElementById("role").value;

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        message.textContent = "";
        message.style.color = "";


        if (password !== confirmPassword) {

            message.textContent =
                "Passwords do not match.";

            message.style.color = "red";

            return;
        }


        if (password.length < 6) {

            message.textContent =
                "Password must be at least 6 characters.";

            message.style.color = "red";

            return;
        }


        button.disabled = true;
        button.textContent = "Creating Account...";


        try {

            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,
                    password: password,

                    options: {
                        data: {
                            full_name: name,
                            phone: phone,
                            location: location,
                            role: role
                        }
                    }

                });


            if (error) {
                throw error;
            }


            console.log("User created:", data.user);


            message.textContent =
                "Account created successfully!";

            message.style.color = "green";


            form.reset();


        } catch (error) {

            console.error(error);

            message.textContent =
                error.message || "Registration failed.";

            message.style.color = "red";


        } finally {

            button.disabled = false;

            button.textContent =
                "Create Account";

        }

    });

</script>

</body>
</html>
