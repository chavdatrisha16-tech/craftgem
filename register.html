<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Hidden Gems</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-container {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-box {
            width: 500px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .auth-box h1 {
            text-align: center;
            color: #3d261b;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #4b2e20;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #c56b32;
        }

        .register-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #c56b32;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-submit:hover {
            background: #9f4f22;
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }

        .auth-link a {
            color: #c56b32;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home {
            text-align: center;
            margin-top: 15px;
        }

        .back-home a {
            color: #666;
            text-decoration: none;
        }

        .password-message {
            font-size: 13px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">

            <div class="logo">
                Hidden<span>Gems</span>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="artisans.html">Explore Artisans</a></li>
                <li><a href="index.html#categories">Categories</a></li>
                <li><a href="index.html#about">About Us</a></li>
            </ul>

        </nav>
    </header>


    <!-- Register Form -->
    <div class="auth-container">

        <div class="auth-box">

            <h1>Create Account</h1>

            <p class="subtitle">
                Join the Hidden Gems community
            </p>


            <form id="registerForm">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Phone -->
                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        maxlength="10"
                        required
                    >

                </div>


                <!-- Location -->
                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Enter your city/location"
                        required
                    >

                </div>


                <!-- Account Type -->
                <div class="form-group">

                    <label for="role">
                        Register As
                    </label>

                    <select id="role" required>

                        <option value="">
                            Select account type
                        </option>

                        <option value="user">
                            User
                        </option>

                        <option value="artisan">
                            Artisan
                        </option>

                    </select>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                    <p id="passwordMessage"
                       class="password-message">
                    </p>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Submit -->
                <button
                    type="submit"
                    class="register-submit">

                    Create Account

                </button>

            </form>


            <p class="auth-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <div class="back-home">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
