<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Hidden Gems</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-container {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-box {
            width: 500px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .auth-box h1 {
            text-align: center;
            color: #3d261b;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #4b2e20;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #c56b32;
        }

        .register-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #c56b32;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-submit:hover {
            background: #9f4f22;
        }

        .register-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }

        .auth-link a {
            color: #c56b32;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home {
            text-align: center;
            margin-top: 15px;
        }

        .back-home a {
            color: #666;
            text-decoration: none;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<header>
    <nav class="navbar">

        <div class="logo">
            Hidden<span>Gems</span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="artisans.html">Explore Artisans</a></li>
            <li><a href="index.html#categories">Categories</a></li>
            <li><a href="index.html#about">About Us</a></li>
        </ul>

    </nav>
</header>


<div class="auth-container">

    <div class="auth-box">

        <h1>Create Account</h1>

        <p class="subtitle">
            Join the Hidden Gems community
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>


            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>


            <div class="form-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    maxlength="10"
                    minlength="10"
                    inputmode="numeric"
                    required
                >
            </div>


            <div class="form-group">
                <label for="location">Location</label>

                <input
                    type="text"
                    id="location"
                    placeholder="Enter your city/location"
                    required
                >
            </div>


            <div class="form-group">
                <label for="role">Register As</label>

                <select id="role" required>

                    <option value="">
                        Select account type
                    </option>

                    <option value="user">
                        User
                    </option>

                    <option value="artisan">
                        Artisan
                    </option>

                </select>
            </div>


            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >
            </div>


            <div class="form-group">
                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >
            </div>


            <button
                type="submit"
                class="register-submit"
                id="registerButton">

                Create Account

            </button>

            <p id="message" class="message"></p>

        </form>


        <p class="auth-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <div class="back-home">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>

    </div>

</div>


<!-- ===================================================== -->
<!-- SUPABASE -->
<!-- ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    // =====================================================
    // SUPABASE CONFIGURATION
    // =====================================================

    const SUPABASE_URL =
        "https://qxzxzuyrzuqwgdunzlek.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_1b5y0mhKKjobcvFzXHIHOQ_vco2_Ldl";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    console.log("CraftGem Supabase connected successfully");


    // =====================================================
    // FORM ELEMENTS
    // =====================================================

    const form =
        document.getElementById("registerForm");

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("registerButton");


    // =====================================================
    // MESSAGE FUNCTION
    // =====================================================

    function showMessage(text, color) {

        message.textContent = text;
        message.style.color = color;

    }


    // =====================================================
    // REGISTER FORM
    // =====================================================

    form.addEventListener("submit", async function(event) {

        event.preventDefault();


        // -------------------------------------------------
        // GET FORM VALUES
        // -------------------------------------------------

        const name =
            document.getElementById("name")
                .value
                .trim();

        const email =
            document.getElementById("email")
                .value
                .trim()
                .toLowerCase();

        const phone =
            document.getElementById("phone")
                .value
                .trim();

        const location =
            document.getElementById("location")
                .value
                .trim();

        const role =
            document.getElementById("role")
                .value;

        const password =
            document.getElementById("password")
                .value;

        const confirmPassword =
            document.getElementById("confirmPassword")
                .value;


        showMessage("", "");


        // =================================================
        // VALIDATION
        // =================================================

        if (password !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "red"
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Password must be at least 6 characters.",
                "red"
            );

            return;
        }


        if (!/^\d{10}$/.test(phone)) {

            showMessage(
                "Please enter a valid 10-digit phone number.",
                "red"
            );

            return;
        }


        if (!role) {

            showMessage(
                "Please select User or Artisan.",
                "red"
            );

            return;
        }


        // =================================================
        // DISABLE BUTTON
        // =================================================

        button.disabled = true;

        button.textContent =
            "Creating Account...";


        try {

            // =================================================
            // CREATE AUTH ACCOUNT
            // =================================================

            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {

                            full_name: name,

                            phone: phone,

                            location: location,

                            user_type: role

                        }

                    }

                });


            if (error) {

                throw error;

            }


            const user = data.user;


            if (!user) {

                throw new Error(
                    "Account could not be created."
                );

            }


            console.log(
                "Auth user created:",
                user.id
            );


            // =================================================
            // CREATE PROFILE
            // =================================================

            const { error: profileError } =
                await supabaseClient
                    .from("profiles")
                    .insert({

                        id: user.id,

                        full_name: name,

                        email: email,

                        phone: phone,

                        location: location,

                        user_type: role

                    });


            if (profileError) {

                console.error(
                    "Profile Error:",
                    profileError
                );

                throw new Error(
                    "Account was created but profile could not be saved. " +
                    profileError.message
                );

            }


            // =================================================
            // CREATE ARTISAN PROFILE
            // =================================================

            if (role === "artisan") {

                const { error: artisanError } =
                    await supabaseClient
                        .from("artisans")
                        .insert({

                            user_id: user.id,

                            artisan_name: name,

                            location: location

                        });


                if (artisanError) {

                    console.error(
                        "Artisan Error:",
                        artisanError
                    );

                    throw new Error(
                        "Account was created but artisan profile could not be created. " +
                        artisanError.message
                    );

                }

            }


            // =================================================
            // SUCCESS
            // =================================================

            showMessage(
                "Account created successfully! Redirecting to login...",
                "green"
            );


            form.reset();


            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1800);


        } catch (error) {

            console.error(
                "Registration Error:",
                error
            );


            showMessage(
                error.message ||
                "Registration failed.",
                "red"
            );


        } finally {

            button.disabled = false;

            button.textContent =
                "Create Account";

        }

    });

</script>

</body>
</html>
