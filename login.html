<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Hidden Gems</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-container {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-box {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .auth-box h1 {
            text-align: center;
            color: #3d261b;
            margin-bottom: 10px;
        }

        .auth-box .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #4b2e20;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #c56b32;
        }

        .login-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #c56b32;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-submit:hover {
            background: #9f4f22;
        }

        .login-submit:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 7px;
            font-size: 14px;
            line-height: 1.5;
            display: none;
        }

        .message.success {
            display: block;
            background: #e8f7e8;
            color: #267326;
            border: 1px solid #b7dfb7;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #b42318;
            border: 1px solid #f0b5b0;
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }

        .auth-link a {
            color: #c56b32;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home {
            text-align: center;
            margin-top: 15px;
        }

        .back-home a {
            color: #666;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <nav class="navbar">

            <div class="logo">
                Hidden<span>Gems</span>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="artisans.html">Explore Artisans</a></li>
                <li><a href="index.html#categories">Categories</a></li>
                <li><a href="index.html#about">About Us</a></li>
            </ul>

        </nav>
    </header>


    <div class="auth-container">

        <div class="auth-box">

            <h1>Welcome Back!</h1>

            <p class="subtitle">
                Login to your Hidden Gems account
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-submit"
                    id="loginButton"
                >
                    Login
                </button>


                <div
                    id="message"
                    class="message"
                ></div>

            </form>


            <p class="auth-link">
                Don't have an account?
                <a href="register.html">
                    Create Account
                </a>
            </p>


            <div class="back-home">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>


    <!-- =====================================================
         SUPABASE
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        // =====================================================
        // SUPABASE CONFIGURATION
        // =====================================================

        const SUPABASE_URL =
            "https://tsgrrnivmaujjteavgkf.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_1b5y0mhKKjobcvFzXHIHOQ_vco2_Ldl";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        // =====================================================
        // ELEMENTS
        // =====================================================

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");


        // =====================================================
        // MESSAGE FUNCTION
        // =====================================================

        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;
        }


        // =====================================================
        // LOGIN
        // =====================================================

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;


                if (!email || !password) {

                    showMessage(
                        "Please enter your email and password.",
                        "error"
                    );

                    return;
                }


                // Disable button

                loginButton.disabled = true;

                loginButton.textContent =
                    "Logging in...";


                showMessage(
                    "Checking your account...",
                    "success"
                );


                try {

                    // =================================================
                    // SUPABASE LOGIN
                    // =================================================

                    const {
                        data,
                        error
                    } =
                        await supabaseClient.auth.signInWithPassword({

                            email: email,

                            password: password

                        });


                    // =================================================
                    // LOGIN ERROR
                    // =================================================

                    if (error) {

                        console.error(
                            "Login error:",
                            error
                        );

                        throw error;
                    }


                    if (!data.user) {

                        throw new Error(
                            "User account could not be found."
                        );
                    }


                    const user =
                        data.user;


                    // =================================================
                    // GET USER PROFILE
                    // =================================================

                    const {
                        data: profile,
                        error: profileError
                    } =
                        await supabaseClient
                            .from("profiles")
                            .select(
                                "id, full_name, email, phone, location, user_type"
                            )
                            .eq("id", user.id)
                            .single();


                    if (profileError) {

                        console.error(
                            "Profile error:",
                            profileError
                        );

                        throw new Error(
                            "Login successful, but your profile could not be loaded."
                        );
                    }


                    // =================================================
                    // SAVE LOGIN INFORMATION
                    // =================================================

                    localStorage.setItem(
                        "userId",
                        user.id
                    );

                    localStorage.setItem(
                        "userEmail",
                        user.email || ""
                    );

                    localStorage.setItem(
                        "userName",
                        profile.full_name || ""
                    );

                    localStorage.setItem(
                        "userType",
                        profile.user_type || "user"
                    );


                    // =================================================
                    // SUCCESS
                    // =================================================

                    showMessage(
                        "Login successful! Redirecting...",
                        "success"
                    );


                    // =================================================
                    // REDIRECT
                    // =================================================

                    setTimeout(function() {

                        if (
                            profile.user_type === "artisan"
                        ) {

                            window.location.href =
                                "artisan-dashboard.html";

                        } else {

                            window.location.href =
                                "index.html";

                        }

                    }, 1000);


                } catch (error) {

                    console.error(
                        "Login failed:",
                        error
                    );


                    let errorMessage =
                        error.message ||
                        "Unable to login.";


                    // Friendly messages

                    if (
                        errorMessage
                            .toLowerCase()
                            .includes("invalid login credentials")
                    ) {

                        errorMessage =
                            "Invalid email or password.";

                    }


                    else if (
                        errorMessage
                            .toLowerCase()
                            .includes("email not confirmed")
                    ) {

                        errorMessage =
                            "Please confirm your email before logging in.";

                    }


                    showMessage(
                        errorMessage,
                        "error"
                    );


                } finally {

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Login";

                }

            }
        );

    </script>

</body>
</html>
