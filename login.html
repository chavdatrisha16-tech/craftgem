<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hidden Gems</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-container {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-box {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .auth-box h1 {
            text-align: center;
            color: #3d261b;
            margin-bottom: 10px;
        }

        .auth-box .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #4b2e20;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #c56b32;
        }

        .login-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #c56b32;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-submit:hover {
            background: #9f4f22;
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }

        .auth-link a {
            color: #c56b32;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home {
            text-align: center;
            margin-top: 15px;
        }

        .back-home a {
            color: #666;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <nav class="navbar">

            <div class="logo">
                Hidden<span>Gems</span>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="artisans.html">Explore Artisans</a></li>
                <li><a href="index.html#categories">Categories</a></li>
                <li><a href="index.html#about">About Us</a></li>
            </ul>

        </nav>
    </header>


    <div class="auth-container">

        <div class="auth-box">

            <h1>Welcome Back!</h1>

            <p class="subtitle">
                Login to your Hidden Gems account
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>


                <button type="submit" class="login-submit">
                    Login
                </button>

            </form>


            <p class="auth-link">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

            <div class="back-home">
                <a href="index.html">← Back to Home</a>
            </div>

        </div>

    </div>


    <script src="js/script.js"></script>

</body>
</html>
